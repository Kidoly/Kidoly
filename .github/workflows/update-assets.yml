# Rebuilds the static cards when their content changes. The live cards (hero,
# activity, latest post) are served by albanmary.com/github/*.svg.
name: Update README cards

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/**
      - fonts/**
      - package.json
      - package-lock.json
      - .github/workflows/update-assets.yml

permissions:
  contents: write

concurrency:
  group: update-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "cards unchanged"
          else
            git commit -m "chore: update README cards"
            git push
          fi
